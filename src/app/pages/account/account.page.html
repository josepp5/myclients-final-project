
<ion-content [fullscreen]="true">
  <div class="main-header"></div>
<ion-grid>
  <ion-row class="ion-justify-content-center">
    <ion-col size="12" sizeLg="10" sizeMd="10" sizeXl="7">
      <ion-card>
        <ion-fab horizontal="end">
          <ion-fab-button size="small" color="medium" id="open-modal">
            <ion-icon name="build-outline"></ion-icon>
          </ion-fab-button>
        </ion-fab>
        <ion-img alt="Silhouette of mountains" *ngIf="!user.pic" src="https://ionicframework.com/docs/img/demos/card-media.png" />
        <ion-img alt="profile pic" *ngIf="user.pic" [src]="user.pic" />
    
        <ion-card-header>
          <ion-card-title style="font-size: larger;">{{ userEmail }}</ion-card-title>
          <ion-card-subtitle>{{ user.rol }}</ion-card-subtitle>
        </ion-card-header>
    
        <ion-row class="ion-justify-content-center" *ngIf="picOpen">
          <ion-col size="10">
            <app-camera-images></app-camera-images>
          </ion-col>
        </ion-row>
      </ion-card>
    </ion-col>
  </ion-row>
</ion-grid>

  <ion-modal #modal trigger="open-modal" [initialBreakpoint]="1" [breakpoints]="[0, 1]">
    <ng-template>
      <div class="block">
        <app-camera-images></app-camera-images>
      </div>
      <div>
        <ion-button expand="block" (click)="modal.dismiss()" (click)="onConfirmPic()">
          <ion-icon  name="checkmark-outline"></ion-icon>
        </ion-button>
      </div>
      
    </ng-template>
  </ion-modal>
  
</ion-content>

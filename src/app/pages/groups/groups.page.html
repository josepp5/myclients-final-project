<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="user/tabs/tab4"></ion-back-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <div class="main-header"></div>
  
  <ion-grid>
    <ion-row class="ion-margin-horizontal ion-margin-top">
      <ion-col>
        <ion-label color="light" name="allfeatures">
          <b>All Groups</b>
        </ion-label>
      </ion-col>
    </ion-row>

    <ion-row class="ion-margin-horizontal">
      <ion-col *ngFor="let item of groups" size="6" sizeLg="4" sizeMd="4" sizeSm="6">
        <ion-card class="ion-text-center">
          <ion-item>
            <ion-toggle [disabled]="item.id === 'Clientes' ? true : false" [checked]="item.active" (ionChange)="onToggleChanged($event, item.id)" color="success" justify="end" aria-label="toggle"></ion-toggle>
          </ion-item>
          <ion-card-header>

            <div align="center">
                <img src='{{item.icon}}' />
            </div>

          </ion-card-header>
          <ion-card-content>
            <ion-label color="primary" name="itemname">{{ item?.id }}</ion-label>
          </ion-card-content>
        </ion-card>
      </ion-col>
      
    </ion-row>

  </ion-grid>
  </ion-content>

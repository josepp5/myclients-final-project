<ion-tabs (ionTabsDidChange)="ionTabsDidChange($event)">
  <ion-tab-bar slot="bottom" mode="ios">
    <ion-tab-button tab="tab1">
      <ion-icon name="add-circle-outline"></ion-icon>
      <ion-label>Formulario</ion-label>
    </ion-tab-button>

    <ion-tab-button tab="tab2">
      <ion-icon name="list-outline"></ion-icon>
      <ion-label>Lista</ion-label>
    </ion-tab-button>

    <ion-tab-button tab="tab3">
      <ion-icon name="person-outline"></ion-icon>
      <ion-label>Cuenta</ion-label>
    </ion-tab-button>

    <ion-tab-button tab="tab4">
      <ion-icon name="home-outline"></ion-icon>
      <ion-label>Home</ion-label>
    </ion-tab-button>
  </ion-tab-bar>
</ion-tabs>
<ion-fab slot="fixed" vertical="bottom" horizontal="end" style="margin-bottom: 12%;">
  <ion-fab-button size="small" (click)="goToForm()">
    <ion-icon name="add"></ion-icon>
  </ion-fab-button>
</ion-fab>
